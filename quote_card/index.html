<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kutipan Litnus PrintLab</title>
  <style>
    :root { color-scheme: light; font: 14px/1.5 system-ui, sans-serif; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; }
    .card { padding: 22px; border-radius: 24px; background: #0b6664; }
    .slides { display: grid; min-width: 0; }
    .slide { grid-area: 1 / 1; min-width: 0; visibility: hidden; display: flex; flex-direction: column; }
    .slide.active { visibility: visible; }
    .topic { margin: 0 0 14px; color: #d4ebe8; font-size: 12px; }
    blockquote { margin: 0; font: 500 clamp(20px, 5.5vw, 24px)/1.35 Georgia, serif; overflow-wrap: anywhere; }
    .original { margin: 12px 0 20px; color: #d4ebe8; font-size: 13px; overflow-wrap: anywhere; }
    .author { display: flex; align-items: center; gap: 12px; margin-top: auto; min-height: 56px; }
    .author img { width: 56px; height: 56px; flex: 0 0 56px; object-fit: cover; object-position: center 25%; border-radius: 12px; filter: grayscale(100%); }
    .author strong { font-weight: 650; overflow-wrap: anywhere; }
    .controls { margin-top: 16px; padding-top: 12px; border-top: 1px solid #438b87; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .count { margin-right: auto; font-variant-numeric: tabular-nums; color: #d4ebe8; }
    button { font: inherit; color: #fff; background: transparent; border: 1px solid #8cbdb7; border-radius: 10px; min-width: 44px; min-height: 44px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #175451; }
    button:active { background: #083e3c; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    [hidden] { display: none !important; }
    @media (max-width: 340px) {
      .card { padding: 18px; border-radius: 20px; }
      .controls { gap: 6px; }
      .original { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Kutipan tentang komunikasi, buku, dan berkarya" aria-roledescription="karusel" hidden>
    <div class="slides" aria-live="off"></div>
    <div class="controls" aria-label="Kontrol kutipan">
      <span class="count" aria-label="Nomor kutipan"></span>
      <button id="previous" aria-label="Kutipan sebelumnya">‹</button>
      <button id="toggle" aria-label="Jeda pergantian otomatis">Jeda</button>
      <button id="next" aria-label="Kutipan berikutnya">›</button>
    </div>
  </main>
  <script>
    const card = document.querySelector('.card');
    const slides = document.querySelector('.slides');
    const counter = document.querySelector('.count');
    const toggle = document.querySelector('#toggle');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let quotes = [], index = 0, paused = reducedMotion.matches, timer, signature = '', storageKey;
    let interval = 12000, hovering = false, focusWithin = false, lastHeight = 0;

    function send(type, extra = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, '*');
    }
    function resize() {
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      if (height !== lastHeight) {
        lastHeight = height;
        send('streamlit:setFrameHeight', { height });
      }
    }
    function remember() {
      try { sessionStorage.setItem(storageKey, JSON.stringify({ index, paused })); } catch (_) {}
    }
    function schedule() {
      clearTimeout(timer);
      if (!paused && !hovering && !document.hidden && !focusWithin) {
        timer = setTimeout(() => { show(index + 1); schedule(); }, interval);
      }
    }
    function show(next) {
      index = (next + quotes.length) % quotes.length;
      [...slides.children].forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
        slide.setAttribute('aria-hidden', String(i !== index));
        slide.inert = i !== index;
      });
      counter.textContent = `${index + 1} / ${quotes.length}`;
      toggle.textContent = paused ? 'Putar' : 'Jeda';
      toggle.setAttribute('aria-label', paused ? 'Putar pergantian otomatis' : 'Jeda pergantian otomatis');
      slides.setAttribute('aria-live', paused ? 'polite' : 'off');
      remember();
      requestAnimationFrame(resize);
    }
    function navigate(delta) {
      paused = true;
      show(index + delta);
      schedule();
    }
    document.querySelector('#previous').addEventListener('click', () => navigate(-1));
    document.querySelector('#next').addEventListener('click', () => navigate(1));
    toggle.addEventListener('click', () => {
      paused = !paused;
      if (!paused) focusWithin = false;
      show(index);
      schedule();
    });
    card.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        navigate(event.key === 'ArrowRight' ? 1 : -1);
      }
    });
    card.addEventListener('mouseenter', () => { hovering = true; schedule(); });
    card.addEventListener('mouseleave', () => { hovering = false; schedule(); });
    card.addEventListener('focusin', () => { focusWithin = true; schedule(); });
    card.addEventListener('focusout', () => setTimeout(() => {
      focusWithin = card.contains(document.activeElement);
      schedule();
    }, 0));
    document.addEventListener('visibilitychange', schedule);
    reducedMotion.addEventListener('change', () => {
      if (reducedMotion.matches) { paused = true; if (quotes.length) show(index); schedule(); }
    });
    new ResizeObserver(resize).observe(document.body);

    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
      const args = event.data.args;
      const nextSignature = JSON.stringify([args.menu, args.quotes]);
      if (signature === nextSignature) return;
      signature = nextSignature;
      quotes = args.quotes;
      if (!Array.isArray(quotes) || !quotes.length) return;
      interval = Math.max(8000, Number(args.interval_ms) || 12000);
      storageKey = `litnus-quote:${args.menu}`;
      index = Number(args.start_index) || 0;
      paused = reducedMotion.matches;
      try {
        const saved = JSON.parse(sessionStorage.getItem(storageKey));
        if (Number.isInteger(saved?.index)) index = Math.max(0, saved.index) % quotes.length;
        if (typeof saved?.paused === 'boolean') paused = saved.paused || reducedMotion.matches;
      } catch (_) {}
      slides.replaceChildren();
      quotes.forEach((quote, i) => {
        const slide = document.createElement('article');
        slide.className = 'slide';
        slide.setAttribute('aria-label', `${i + 1} dari ${quotes.length}`);
        slide.setAttribute('aria-roledescription', 'slide');
        const topic = document.createElement('p');
        topic.className = 'topic';
        topic.textContent = quote.topic;
        const text = document.createElement('blockquote');
        text.textContent = `“${quote.translation}”`;
        const original = document.createElement('p');
        original.className = 'original';
        original.lang = 'en';
        original.textContent = `“${quote.original}”`;
        const author = document.createElement('div');
        author.className = 'author';
        if (quote.image) {
          const photo = document.createElement('img');
          photo.alt = `Potret ${quote.author}`;
          photo.width = photo.height = 56;
          photo.hidden = true;
          photo.addEventListener('load', () => { photo.hidden = false; resize(); });
          photo.addEventListener('error', () => { photo.hidden = true; resize(); });
          photo.src = quote.image;
          author.append(photo);
        }
        const name = document.createElement('strong');
        name.textContent = quote.author;
        author.append(name);
        slide.append(topic, text, original, author);
        slides.append(slide);
      });
      card.hidden = false;
      show(index);
      schedule();
    });
    send('streamlit:componentReady', { apiVersion: 1 });
  </script>
</body>
</html>
