<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kutipan Litnus PrintLab</title>
  <style>
    :root { color-scheme: light; font: 14px/1.5 "Source Sans 3", "Segoe UI", sans-serif; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 4px 6px 22px; background: transparent; }
    .card {
      padding: 22px; border-radius: 24px;
      background: linear-gradient(115deg, rgba(9,93,92,.97) 0%, rgba(17,119,116,.96) 60%, rgba(16,108,110,.98) 100%);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 14px 22px -10px rgba(9,93,92,.40), inset 0 1px 0 rgba(255,255,255,.20);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .card:focus-visible { outline: 2px solid #fff; outline-offset: -5px; }
    .slides { display: grid; min-width: 0; }
    .slide { grid-area: 1 / 1; min-width: 0; visibility: hidden; display: grid; grid-template-areas: "copy" "author"; grid-template-columns: minmax(0,1fr); row-gap: 20px; align-content: space-between; }
    .slide.active { visibility: visible; }
    .slide.has-photo { grid-template-areas: "copy photo" "author photo"; grid-template-columns: minmax(0,1fr) 76px; column-gap: 18px; }
    .copy { grid-area: copy; min-width: 0; }
    .topic { margin: 0 0 10px; color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .035em; }
    blockquote { margin: 0; font-size: clamp(18px, 4.6vw, 21px); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
    .original { margin: 12px 0 0; color: #fff; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
    .author { grid-area: author; min-width: 0; align-self: end; }
    .author strong { display: inline-block; max-width: 100%; padding: 8px 16px; border-radius: 99px; background: rgba(235,247,246,.94); border: 1px solid rgba(255,255,255,.55); color: #095d5c; font-size: 12px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
    .portrait { grid-area: photo; width: 76px; height: 96px; align-self: center; object-fit: cover; object-position: center 25%; border-radius: 16px; border: 1px solid rgba(255,255,255,.5); box-shadow: 0 8px 16px -8px rgba(3,48,47,.5); filter: grayscale(100%); }
    [hidden] { display: none !important; }
    @media (max-width: 380px) {
      .card { padding: 18px; border-radius: 22px; }
      .slide.has-photo { grid-template-areas: "copy copy" "author photo"; grid-template-columns: minmax(0,1fr) 56px; gap: 16px 12px; }
      .portrait { width: 56px; height: 56px; border-radius: 12px; }
      .author { align-self: center; }
      .author strong { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Kutipan tentang buku, marketing, dan komunikasi. Fokuskan kartu untuk menahan pergantian." aria-roledescription="karusel" tabindex="0" hidden>
    <div class="slides" aria-live="off"></div>
  </main>
  <script>
    const card = document.querySelector('.card');
    const slides = document.querySelector('.slides');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let quotes = [], index = 0, timer, signature = '', storageKey;
    let interval = 12000, hovering = false, focusWithin = false, touching = false, lastHeight = 0;

    function send(type, extra = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, '*');
    }
    function resize() {
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      if (height !== lastHeight) {
        lastHeight = height;
        send('streamlit:setFrameHeight', { height });
      }
    }
    function remember() {
      try { sessionStorage.setItem(storageKey, JSON.stringify({ index })); } catch (_) {}
    }
    function schedule() {
      clearTimeout(timer);
      if (quotes.length > 1 && !reducedMotion.matches && !hovering && !focusWithin && !touching && !document.hidden) {
        timer = setTimeout(() => { show(index + 1); schedule(); }, interval);
      }
    }
    function show(next) {
      index = (next + quotes.length) % quotes.length;
      [...slides.children].forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
        slide.setAttribute('aria-hidden', String(i !== index));
        slide.inert = i !== index;
      });
      remember();
      requestAnimationFrame(resize);
    }
    card.addEventListener('mouseenter', () => { hovering = true; schedule(); });
    card.addEventListener('mouseleave', () => { hovering = false; schedule(); });
    card.addEventListener('focusin', () => { focusWithin = true; schedule(); });
    card.addEventListener('focusout', () => setTimeout(() => {
      focusWithin = card.contains(document.activeElement);
      schedule();
    }, 0));
    card.addEventListener('pointerdown', event => { if (event.pointerType === 'touch') { touching = true; schedule(); } });
    window.addEventListener('pointerup', () => { touching = false; schedule(); });
    window.addEventListener('pointercancel', () => { touching = false; schedule(); });
    document.addEventListener('visibilitychange', schedule);
    reducedMotion.addEventListener('change', schedule);
    new ResizeObserver(resize).observe(document.body);

    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
      const args = event.data.args;
      const nextSignature = JSON.stringify([args.menu, args.quotes]);
      if (signature === nextSignature) return;
      signature = nextSignature;
      quotes = args.quotes;
      if (!Array.isArray(quotes) || !quotes.length) return;
      interval = Math.max(8000, Number(args.interval_ms) || 12000);
      storageKey = `litnus-quote-v2:${args.menu}`;
      index = Number(args.start_index) || 0;
      try {
        const saved = JSON.parse(sessionStorage.getItem(storageKey));
        if (Number.isInteger(saved?.index)) index = Math.max(0, saved.index) % quotes.length;
      } catch (_) {}
      slides.replaceChildren();
      quotes.forEach(quote => {
        const slide = document.createElement('article');
        slide.className = 'slide';
        const copy = document.createElement('div');
        copy.className = 'copy';
        const topic = document.createElement('p');
        topic.className = 'topic';
        topic.textContent = quote.topic;
        const text = document.createElement('blockquote');
        text.textContent = `“${quote.translation}”`;
        const original = document.createElement('p');
        original.className = 'original';
        original.lang = 'en';
        original.textContent = `“${quote.original}”`;
        copy.append(topic, text, original);
        const author = document.createElement('div');
        author.className = 'author';
        const name = document.createElement('strong');
        name.textContent = quote.author;
        author.append(name);
        slide.append(copy, author);
        if (quote.image) {
          const photo = document.createElement('img');
          photo.className = 'portrait';
          photo.alt = `Potret ${quote.author}`;
          photo.width = 76;
          photo.height = 96;
          photo.hidden = true;
          photo.addEventListener('load', () => { photo.hidden = false; slide.classList.add('has-photo'); resize(); });
          photo.addEventListener('error', () => { photo.hidden = true; slide.classList.remove('has-photo'); resize(); });
          photo.src = quote.image;
          slide.append(photo);
        }
        slides.append(slide);
      });
      card.hidden = false;
      show(index);
      schedule();
    });
    send('streamlit:componentReady', { apiVersion: 1 });
  </script>
</body>
</html>
